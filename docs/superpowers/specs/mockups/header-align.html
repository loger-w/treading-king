<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Header Align — Before / After</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,500;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14110c;
    --bg-card: #1d1812;
    --bg-deep: #0d0a07;
    --line: #2e2a22;
    --line-strong: #4a4234;
    --ink: #ede4d3;
    --ink-muted: #d4c8b0;
    --ink-dim: #8a8273;
    --accent: #e85a4f;
    --bull: #e85a4f;
    --bear: #7fc99a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg); color: var(--ink);
    font-family: 'Inter Tight', -apple-system, system-ui, sans-serif;
    font-feature-settings: 'ss01', 'tnum';
    min-height: 100vh; -webkit-font-smoothing: antialiased;
  }

  .demo-section { padding: 40px 0 80px; border-bottom: 2px solid var(--line-strong); }
  .demo-label {
    max-width: 1960px; margin: 0 auto 24px;
    padding: 0 36px;
    font-family: 'Source Serif 4', serif; font-style: italic; font-weight: 500;
    font-size: 28px; color: var(--ink-muted);
  }
  .demo-label .badge {
    display: inline-block; margin-left: 12px; vertical-align: 4px;
    padding: 2px 10px; font-family: 'Inter Tight'; font-style: normal;
    font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600;
  }
  .demo-label .badge.before { background: var(--line); color: var(--ink-dim); border: 1px solid var(--line-strong); }
  .demo-label .badge.after { background: var(--accent); color: var(--bg); }

  /* Masthead 兩種寬度 */
  .masthead { border-top: 4px solid var(--accent); background: var(--bg-card); }
  .masthead-inner-1600 { max-width: 1600px; margin: 0 auto; padding: 24px 60px 16px; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .masthead-inner-1960 { max-width: 1960px; margin: 0 auto; padding: 24px 36px 16px; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .brand { font-family: 'Source Serif 4', serif; font-weight: 700; font-size: 30px; letter-spacing: -.5px; }
  .brand em { font-weight: 700; font-style: italic; }
  .brand-sep { font-weight: 300; color: var(--ink-muted); margin: 0 6px; }
  .meta { font-size: 12px; color: var(--ink-dim); letter-spacing: .3px; }
  .meta .dot { opacity: .4; margin: 0 8px; }

  /* Nav 兩種寬度 */
  .nav { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: rgba(29,24,18,.4); }
  .nav-inner-1600 { max-width: 1600px; margin: 0 auto; padding: 0 60px; display: flex; gap: 0; }
  .nav-inner-1960 { max-width: 1960px; margin: 0 auto; padding: 0 36px; display: flex; gap: 0; }
  .nav-link {
    padding: 14px 16px; font-size: 12px; text-transform: uppercase; letter-spacing: 2px;
    color: var(--ink-dim); border-bottom: 2px solid transparent; cursor: pointer;
  }
  .nav-link.active { color: var(--ink); border-bottom-color: var(--accent); }

  /* Toolbar + 4-col grid 統一 1960 */
  .toolbar {
    max-width: 1960px; margin: 0 auto; padding: 22px 36px 10px;
    display: grid; grid-template-columns: 300px 340px 1fr 300px; align-items: center; gap: 24px;
  }
  .ws-pill { grid-column: 1 / 3; justify-self: start; display: inline-flex; align-items: baseline; gap: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--ink-dim); }
  .ws-pill .dot { color: var(--bear); font-size: 14px; }
  .toolbar-search { grid-column: 3 / 4; display: flex; align-items: center; border: 1px solid var(--line-strong); background: var(--bg-card); }
  .toolbar-search input { flex: 1; background: transparent; border: 0; color: var(--ink); padding: 9px 14px; font: inherit; font-size: 14px; outline: none; }
  .toolbar-search input::placeholder { color: var(--ink-dim); }
  .toolbar-search .ico { padding: 0 14px; color: var(--ink-dim); }
  .rules-btn {
    grid-column: 4 / 5; justify-self: end;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 18px; border: 1px solid var(--accent); color: var(--accent);
    background: transparent; font-size: 12px; text-transform: uppercase; letter-spacing: 1.8px; font-weight: 500;
  }
  .rules-btn .badge { background: var(--accent); color: var(--bg); padding: 1px 6px; font-size: 11px; font-weight: 600; }

  .main-area {
    max-width: 1960px; margin: 0 auto; padding: 12px 36px 0;
  }
  .grid-4 {
    display: grid; grid-template-columns: 300px 340px 1fr 300px; gap: 24px;
  }
  .col-stub {
    border: 1px dashed var(--line-strong); background: rgba(29,24,18,.3);
    padding: 14px 12px; min-height: 96px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .col-stub h3 { font-family: 'Source Serif 4', serif; font-weight: 700; font-size: 16px; letter-spacing: -.3px; }
  .col-stub .hint { font-size: 11px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 1px; }

  /* Marker：左右 guide line 顯示對齊 */
  .demo-section { position: relative; }
  .guide-l, .guide-r {
    position: absolute; top: 40px; bottom: 30px; width: 0;
    border-left: 1px dashed var(--accent); opacity: .55; pointer-events: none;
  }
  .guide-l::after, .guide-r::after {
    content: attr(data-label); position: absolute; top: -6px;
    font-size: 9px; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--accent); background: var(--bg); padding: 1px 4px;
    white-space: nowrap;
  }
  .guide-l::after { left: -38px; }
  .guide-r::after { right: -38px; }
</style>
</head>
<body>

<!-- ============== Before：Masthead/Nav 1600，main 1960 ============== -->
<div class="demo-section">
  <div class="demo-label">
    目前狀態
    <span class="badge before">Before</span>
  </div>

  <!-- Masthead 1600 -->
  <div class="masthead">
    <div class="masthead-inner-1600">
      <h1 class="brand">treading <span class="brand-sep">·</span> <em>king</em></h1>
      <div class="meta">2026年5月13日 星期三<span class="dot">·</span>盤中連續競價</div>
    </div>
  </div>

  <!-- Nav 1600 -->
  <div class="nav">
    <div class="nav-inner-1600">
      <span class="nav-link">系統狀態</span>
      <span class="nav-link active">即時監控</span>
    </div>
  </div>

  <!-- Toolbar 1960 -->
  <div class="toolbar">
    <span class="ws-pill"><span class="dot">●</span> 連線中</span>
    <div class="toolbar-search">
      <span class="ico">⌕</span>
      <input type="text" placeholder="搜尋股票代號或名稱…" />
    </div>
    <button class="rules-btn">⚙ 訊號規則 <span class="badge">3</span></button>
  </div>

  <!-- 4-col main 1960 -->
  <div class="main-area">
    <div class="grid-4">
      <div class="col-stub"><h3>觸發歷史</h3><span class="hint">300 px</span></div>
      <div class="col-stub"><h3>自選清單</h3><span class="hint">340 px</span></div>
      <div class="col-stub"><h3>分時走勢 + 五檔</h3><span class="hint">1fr</span></div>
      <div class="col-stub"><h3>明細</h3><span class="hint">300 px</span></div>
    </div>
  </div>

  <!-- guide line：對齊到觸發歷史左邊 / 明細右邊 -->
  <div class="guide-l" data-label="觸發歷史 左緣" style="left: calc(50% - 944px);"></div>
  <div class="guide-r" data-label="明細 右緣" style="left: calc(50% + 944px);"></div>
</div>

<!-- ============== After：通通 1960 對齊 ============== -->
<div class="demo-section">
  <div class="demo-label">
    對齊後
    <span class="badge after">After</span>
  </div>

  <!-- Masthead 1960 -->
  <div class="masthead">
    <div class="masthead-inner-1960">
      <h1 class="brand">treading <span class="brand-sep">·</span> <em>king</em></h1>
      <div class="meta">2026年5月13日 星期三<span class="dot">·</span>盤中連續競價</div>
    </div>
  </div>

  <!-- Nav 1960 -->
  <div class="nav">
    <div class="nav-inner-1960">
      <span class="nav-link">系統狀態</span>
      <span class="nav-link active">即時監控</span>
    </div>
  </div>

  <!-- Toolbar 1960 -->
  <div class="toolbar">
    <span class="ws-pill"><span class="dot">●</span> 連線中</span>
    <div class="toolbar-search">
      <span class="ico">⌕</span>
      <input type="text" placeholder="搜尋股票代號或名稱…" />
    </div>
    <button class="rules-btn">⚙ 訊號規則 <span class="badge">3</span></button>
  </div>

  <!-- 4-col main 1960 -->
  <div class="main-area">
    <div class="grid-4">
      <div class="col-stub"><h3>觸發歷史</h3><span class="hint">300 px</span></div>
      <div class="col-stub"><h3>自選清單</h3><span class="hint">340 px</span></div>
      <div class="col-stub"><h3>分時走勢 + 五檔</h3><span class="hint">1fr</span></div>
      <div class="col-stub"><h3>明細</h3><span class="hint">300 px</span></div>
    </div>
  </div>

  <div class="guide-l" data-label="觸發歷史 左緣" style="left: calc(50% - 944px);"></div>
  <div class="guide-r" data-label="明細 右緣" style="left: calc(50% + 944px);"></div>
</div>

</body>
</html>
