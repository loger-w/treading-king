[project]
name = "treading-king-backend"
version = "0.1.0"
description = "treading-king BFF — 台股篩股 + 即時訊號"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "supabase>=2.4",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",  # Windows zoneinfo 需要（Asia/Taipei 等 tz key）
    # fubon-neo 從 wheels/ 安裝（不在 PyPI）
]

[tool.ruff]
line-length = 100
target-version = "py312"
