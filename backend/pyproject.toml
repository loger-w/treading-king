[project]
name = "treading-king-backend"
version = "0.1.0"
description = "treading-king BFF — 台股即時監控"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",  # Windows zoneinfo 需要（Asia/Taipei 等 tz key）
    # fubon-neo 從 wheels/ 安裝（不在 PyPI）
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
